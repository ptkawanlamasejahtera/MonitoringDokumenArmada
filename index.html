<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Dokumen Armada</title>
<style>
:root{--bg:#f5f6f8;--cd:#fff;--tx:#1b2430;--mu:#667085;--bd:#e3e7ee;--pri:#1d4ed8;--ex:#fde2e1;--exc:#b42318;--wa:#fff0cc;--wac:#8a5a00;--ok:#dcf5e4;--okc:#17692f;--na:#eef0f3}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--cd:#1b2129;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3440;--pri:#6b9bff;--ex:#4a1d1b;--exc:#ff9d94;--wa:#4a3a10;--wac:#ffd272;--ok:#14391f;--okc:#7fe3a0;--na:#262d37}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:12px 24px;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:center}
h1{font-size:18px;margin:0;flex:1}
button,a.bt{border:0;background:var(--pri);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}
button.g{background:var(--na);color:var(--tx)}
main{padding:16px 24px;width:100%}.mu{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}.bar label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit}
.w{overflow:auto;background:var(--cd);border:1px solid var(--bd);border-radius:10px;max-height:calc(100vh - 235px)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:var(--cd);z-index:1}td.c{cursor:pointer;text-align:center}td.c:hover{outline:2px solid var(--pri);outline-offset:-2px}
td small{display:block;color:var(--pri);font-weight:600}
.w7{background:#f2b705;color:#3b2a00;font-weight:600}td.c.ok,td.c.na{background:none;color:inherit}td.c.w7 small{color:#3b2a00}
.ex{background:var(--ex);color:var(--exc)}.wa{background:var(--wa);color:var(--wac)}.ok{background:var(--ok);color:var(--okc)}.na{background:var(--na);color:var(--mu)}
.k{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.k div,.cd{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.k b{display:block;font-size:28px}
.k .ex,.k .wa,.k .w7{border-color:transparent}.k .ex{background:var(--ex)}.k .wa{background:var(--wa)}.k .w7{background:#f2b705}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cd{margin-bottom:14px;overflow:auto}.cd h2{font-size:14px;margin:0 0 8px}
.n{border-radius:6px;padding:2px 10px;cursor:pointer;display:inline-block;min-width:34px;text-align:center}
.sb{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:120px;background:var(--na)}.sb i{display:block}
.sb .ex{background:#e5484d}.sb .w7{background:#d99a00}.sb .wa{background:#f6d860}.sb .ok{background:#30a46c}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.ov[hidden]{display:none}
#lg{background:var(--bg);z-index:10}.mc{background:var(--cd);border-radius:12px;padding:22px;width:100%;max-width:420px}.mc h3{margin:0 0 4px}.mc label{display:block;margin:12px 0 4px}.mc input,.mc select{width:100%}
.bt2{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}#le{color:var(--exc);margin-top:8px;min-height:18px}
@media(max-width:900px){.k{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style></head><body>
<div id="lg" class="ov"><div class="mc"><h3>Monitoring Dokumen Armada</h3><p class="mu">Silakan login untuk melanjutkan.</p>
<label>Username<input id="lu" autocomplete="username"></label>
<label>PIN<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label>
<div id="le"></div><div class="bt2"><button id="lb" onclick="doLogin()">Login</button></div></div></div>
<header><h1>Monitoring Dokumen Armada</h1>
<button id="b1" onclick="tab('t')">Dokumen</button><button id="b2" class="g" onclick="tab('d')">Dashboard</button>
<span id="up" class="mu"></span><button class="g" onclick="logout()">Keluar</button></header>
<main>
<section id="st">
<div class="bar"><label>Cari<input id="q" placeholder="Kode / nopol…" oninput="renderT()"></label>
<label>Tipe<select id="ft" onchange="renderT()"></select></label>
<label>Dokumen<select id="fd" onchange="renderT()"><option value="">Semua dokumen</option></select></label>
<label>Status<select id="fs" onchange="renderT()"><option value="">Semua status</option><option value="ex">Sudah lewat</option><option value="w7">≤ 7 hari</option><option value="wa">8–30 hari</option><option value="ok">Aman</option><option value="na">Tanpa data</option></select></label>
<label>Bulan<select id="fm"><option value="">Semua</option></select></label>
<label>Tahun<select id="fy"><option value="">Semua</option></select></label>
<label>Start date<input type="date" id="f0"></label><label>End date<input type="date" id="fe"></label>
<button onclick="show()">Show</button><button class="g" onclick="reset()">Reset</button><button onclick="exportCsv()">Export</button></div>
<p class="mu" id="inf"></p>
<div class="w"><table id="tb"></table></div></section>
<section id="sd" hidden></section>
</main>
<div id="mo" class="ov" hidden><div class="mc"><h3 id="mt"></h3><p id="ms" class="mu"></p>
<label>Tanggal masa berlaku<input type="date" id="md"></label>
<label>Status<select id="mp"><option value="0">Normal</option><option value="1">Proses perpanjang</option></select></label>
<label>Upload dokumen (PDF/foto, maks 4 MB)<input type="file" id="mf" accept=".pdf,image/*"></label>
<div id="ml" class="bt2" style="justify-content:flex-start"></div>
<div class="bt2"><button class="g" onclick="closeM()">Batal</button><button onclick="save()">Save</button></div></div></div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyv_BlH1ktlaQ5ri2OzKt26-eS5xMuKz2xYSoFBAv-o2bFacYj0dwV0v9Jughskcfqz/exec';
const DOCS=['PAJAK','STNK','KIR','SIPA','IBM'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,aug:7,sep:8,okt:9,oct:9,nov:10,des:11,dec:11};
const LB={ex:'Sudah lewat',w7:'≤ 7 hari',wa:'8–30 hari',ok:'Aman',na:'Tanpa data'};
const T0=new Date();T0.setHours(0,0,0,0);
let ROWS=[],PIN=sessionStorage.getItem('pin')||'',USR=sessionStorage.getItem('usr')||'',cur=null,busy=false,hold=0,sig='',F={m:'',y:'',s:'',e:''};
const $=s=>document.querySelector(s);
function pd(s){s=s||'';let m=/(\d{1,2})[\s-]+([A-Za-z]+)[\s-]+(\d{4})/.exec(s);if(m){const k=MON[m[2].slice(0,3).toLowerCase()];return k==null?null:new Date(+m[3],k,+m[1])}
m=/(\d{4})-(\d\d)-(\d\d)/.exec(s);return m?new Date(+m[1],m[2]-1,+m[3]):null}
function st(s){const d=pd(s);if(!d)return{k:'na'};const n=Math.round((d-T0)/864e5);return{k:n<0?'ex':n<=7?'w7':n<=30?'wa':'ok',n,d}}
const fmt=d=>d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function tab(x){$('#st').hidden=x!='t';$('#sd').hidden=x!='d';$('#b1').className=x=='t'?'':'g';$('#b2').className=x=='d'?'':'g'}
function doLogin(){USR=$('#lu').value.trim();PIN=$('#lp').value;if(!USR||!PIN){$('#le').textContent='Isi username dan PIN.';return}$('#le').textContent='Memeriksa…';load(false)}
function logout(){sessionStorage.clear();USR=PIN='';ROWS=[];sig='';$('#lp').value='';$('#le').textContent='';$('#lg').hidden=false}
function load(q){
if(!USR||!PIN){$('#lg').hidden=false;return}
if(busy)return;busy=true;const cb='cb'+Date.now(),s=document.createElement('script');
window[cb]=r=>{busy=false;s.remove();delete window[cb];
if(r.error){logout();$('#le').textContent=r.error;return}
sessionStorage.setItem('pin',PIN);sessionStorage.setItem('usr',USR);$('#lg').hidden=true;$('#up').textContent=USR+' · diperbarui '+new Date().toLocaleTimeString('id-ID');
if(q&&Date.now()<hold)return;
const g=JSON.stringify(r.rows);if(g==sig)return;sig=g;ROWS=r.rows;render()};
s.onerror=()=>{busy=false;s.remove();if(!q)$('#le').textContent='Gagal terhubung ke Apps Script.'};
s.src=SCRIPT_URL+'?action=list&user='+encodeURIComponent(USR)+'&pin='+encodeURIComponent(PIN)+'&callback='+cb;document.body.appendChild(s)}
setInterval(()=>{if(!document.hidden&&$('#mo').hidden)load(true)},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(true)});
function render(){
const ts=[...new Set(ROWS.map(r=>r.t))].sort(),v=$('#ft').value;
$('#ft').innerHTML='<option value="">Semua tipe</option>'+ts.map(t=>`<option${t==v?' selected':''}>${t}</option>`).join('');
if($('#fd').options.length<2)DOCS.forEach((d,i)=>$('#fd').add(new Option(d,i)));
if($('#fm').options.length<2)['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'].forEach((m,i)=>$('#fm').add(new Option(m,i+1)));
const ys=[...new Set(ROWS.flatMap(r=>r.d.map(x=>{const d=pd(x);return d&&d.getFullYear()})).filter(Boolean))].sort(),yv=$('#fy').value;
$('#fy').innerHTML='<option value="">Semua</option>'+ys.map(y=>`<option${y==yv?' selected':''}>${y}</option>`).join('');
renderT();renderD()}
function show(){F={m:$('#fm').value,y:$('#fy').value,s:$('#f0').value,e:$('#fe').value};renderT()}
function reset(){['fm','fy','f0','fe'].forEach(i=>$('#'+i).value='');F={m:'',y:'',s:'',e:''};renderT()}
function inR(d){if(!d)return false;if(F.m&&d.getMonth()!=F.m-1)return false;if(F.y&&d.getFullYear()!=F.y)return false;if(F.s&&d<new Date(F.s+'T00:00'))return false;if(F.e&&d>new Date(F.e+'T00:00'))return false;return true}
function frows(){
const q=$('#q').value.toLowerCase(),t=$('#ft').value,d=$('#fd').value,s=$('#fs').value,dOn=F.m||F.y||F.s||F.e;
return ROWS.map((r,ri)=>[r,ri]).filter(([r])=>{
if(q&&!(r.k+r.p).toLowerCase().includes(q))return false;if(t&&r.t!=t)return false;
if(!s&&!dOn)return true;
return(d===''?[0,1,2,3,4]:[+d]).some(i=>(!s||st(r.d[i]).k==s)&&(!dOn||inR(pd(r.d[i]))))})}
function renderT(){
const rows=frows();$('#inf').textContent='Menampilkan '+rows.length+' dari '+ROWS.length+' armada. Klik sel tanggal untuk update, perpanjang, upload, dan download dokumen.';
$('#tb').innerHTML='<tr><th>No</th><th>Kode</th><th>No Polisi</th><th>Tipe</th>'+DOCS.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+
rows.map(([r,ri],n)=>`<tr><td>${n+1}</td><td><b>${r.k}</b></td><td>${r.p}</td><td>${r.t}</td>`+r.d.map((x,i)=>{
const z=st(x);return`<td class="c ${z.k}" data-r="${ri}" data-i="${i}">${z.d?fmt(z.d):'–'}${r.l[i]?' 📎':''}${r.s[i]?'<small>⏳ Proses perpanjang</small>':''}</td>`}).join('')+'</tr>').join('')}
$('#tb').onclick=e=>{const c=e.target.closest('td.c');if(c)openM(+c.dataset.r,+c.dataset.i)};
function exportCsv(){
const h=['Kode','No Polisi','Tipe'];DOCS.forEach(d=>h.push(d,d+' Status',d+' Perpanjang'));
const rows=frows().map(([r])=>{const a=[r.k,r.p,r.t];r.d.forEach((x,i)=>{const z=st(x);a.push(z.d?fmt(z.d):'',LB[z.k],r.s[i]?'Proses perpanjang':'')});return a});
const csv='\ufeff'+[h,...rows].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');
const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));el.download='monitoring-dokumen-armada.csv';el.click()}
const dl=u=>{const m=/\/d\/([^/]+)/.exec(u)||/id=([^&]+)/.exec(u);return m?'https://drive.google.com/uc?export=download&id='+m[1]:u};
function openM(ri,i){const r=ROWS[ri],z=st(r.d[i]);cur={r,i};
$('#mt').textContent=DOCS[i]+' – '+r.k;$('#ms').textContent=r.p+' · '+r.t+(z.d?' · '+(z.n<0?'lewat '+(-z.n)+' hari':z.n+' hari lagi'):' · belum ada data');
$('#md').value=z.d?iso(z.d):'';$('#mp').value=r.s[i]?'1':'0';$('#mf').value='';
const u=r.l[i];$('#ml').innerHTML=u&&u!='#'?`<a class="bt g" href="${u}" target="_blank" rel="noopener">Lihat dokumen</a><a class="bt" href="${dl(u)}">Download dokumen</a>`:(u?'<span class="mu">Dokumen sedang diproses…</span>':'<span class="mu">Belum ada dokumen diunggah.</span>');
$('#mo').hidden=false}
function closeM(){$('#mo').hidden=true}
const b64=f=>new Promise(ok=>{const x=new FileReader();x.onload=()=>ok(x.result.split(',')[1]);x.readAsDataURL(f)});
async function save(){
const dv=$('#md').value,f=$('#mf').files[0],p=+$('#mp').value;
if(f&&f.size>4e6)return alert('File maksimal 4 MB.');
const dt=dv?(+dv.slice(8)+' '+MN[+dv.slice(5,7)-1]+' '+dv.slice(0,4)):'';
const body={user:USR,pin:PIN,kode:cur.r.k,doc:cur.i,date:dt,proses:p,file:f?{name:f.name,mime:f.type||'application/octet-stream',b64:await b64(f)}:null};
if(dt)cur.r.d[cur.i]=dt;cur.r.s[cur.i]=p;if(f)cur.r.l[cur.i]='#';
hold=Date.now()+10000;
try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(body)})}catch(e){return alert('Gagal mengirim: '+e)}
closeM();render()}
function cnt(rs,ix){const c={ex:0,w7:0,wa:0,ok:0,na:0};rs.forEach(r=>ix.forEach(i=>c[st(r.d[i]).k]++));return c}
function go(t,d,s){$('#ft').value=t;$('#fd').value=d;$('#fs').value=s;$('#q').value='';renderT();tab('t')}
const esc=s=>String(s).replace(/'/g,"\\'");
const nb=(c,k,t,d)=>`<span class="n ${k}" onclick="go('${esc(t)}','${d}','${k}')">${c[k]}</span>`;
function sbar(c){const T=c.ex+c.w7+c.wa+c.ok||1;return`<div class="sb"><i class="ex" style="width:${c.ex/T*100}%"></i><i class="w7" style="width:${c.w7/T*100}%"></i><i class="wa" style="width:${c.wa/T*100}%"></i><i class="ok" style="width:${c.ok/T*100}%"></i></div>`}
function renderD(){
const all=cnt(ROWS,[0,1,2,3,4]),pr=ROWS.reduce((a,r)=>a+r.s.reduce((x,y)=>x+y,0),0),K=['ex','w7','wa','ok','na'];
const H='<tr><th>{h}</th><th>Sudah lewat</th><th>≤ 7 hari</th><th>8–30 hari</th><th>Aman</th><th>Tanpa data</th><th>Proporsi</th></tr>';
let h=`<div class="k"><div class="ex"><b>${all.ex}</b>Sudah lewat</div><div class="w7"><b>${all.w7}</b>≤ 7 hari</div><div class="wa"><b>${all.wa}</b>8–30 hari</div><div><b>${all.ok}</b>Aman</div><div><b>${pr}</b>⏳ Proses perpanjang</div></div><div class="g2">`;
h+='<div class="cd"><h2>Per dokumen ('+ROWS.length+' armada)</h2><table>'+H.replace('{h}','Dokumen')+DOCS.map((d,i)=>{const c=cnt(ROWS,[i]);return`<tr><td><b>${d}</b></td>${K.map(k=>'<td>'+nb(c,k,'',i)+'</td>').join('')}<td>${sbar(c)}</td></tr>`}).join('')+'</table></div>';
const ts=[...new Set(ROWS.map(r=>r.t))].sort();
h+='<div class="cd"><h2>Per tipe armada (semua dokumen)</h2><table>'+H.replace('{h}','Tipe (unit)')+ts.map(t=>{const rs=ROWS.filter(r=>r.t==t),c=cnt(rs,[0,1,2,3,4]);return`<tr><td><b>${t}</b> (${rs.length})</td>${K.map(k=>'<td>'+nb(c,k,t,'')+'</td>').join('')}<td>${sbar(c)}</td></tr>`}).join('')+'</table></div></div>';
const L=[];ROWS.forEach((r,ri)=>r.d.forEach((x,i)=>{const z=st(x);if(z.k=='wa'||z.k=='w7')L.push({r,ri,i,n:z.n,d:z.d,k:z.k})}));L.sort((a,b)=>a.n-b.n);
h+=`<div class="cd"><h2>Segera jatuh tempo (≤ 30 hari): ${L.length} dokumen</h2><table><tr><th>Kode</th><th>Nopol</th><th>Tipe</th><th>Dokumen</th><th>Berlaku s/d</th><th>Sisa</th><th>Keterangan</th></tr>`+
L.map(x=>`<tr style="cursor:pointer" onclick="openM(${x.ri},${x.i})"><td><b>${x.r.k}</b></td><td>${x.r.p}</td><td>${x.r.t}</td><td>${DOCS[x.i]}</td><td>${fmt(x.d)}</td><td class="${x.k}">${x.n} hari</td><td>${x.r.s[x.i]?'⏳ Proses perpanjang':'–'}</td></tr>`).join('')+'</table></div>';
$('#sd').innerHTML=h}
load();
</script></body></html>
